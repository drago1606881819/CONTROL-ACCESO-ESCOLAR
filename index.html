<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Acceso Escolar</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #111827;
      text-align: center;
    }

    .contenedor {
      width: min(95%, 560px);
      margin: 20px auto;
    }

    h1 {
      margin: 10px 0 6px;
      font-size: 26px;
    }

    .subtitulo {
      margin: 0 0 15px;
      color: #475569;
    }

    #estado,
    #resultado {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin: 12px 0;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    #estado {
      font-weight: bold;
      font-size: 18px;
    }

    #resultado {
      min-height: 62px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #lector {
      width: 100%;
      max-width: 520px;
      margin: 15px auto;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }

    .nota {
      color: #64748b;
      font-size: 13px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>CONTROL DE ACCESO ESCOLAR</h1>

    <p class="subtitulo">
      Escáner automático de credenciales QR
    </p>

    <div id="estado">
      📷 Iniciando cámara...
    </div>

    <div id="lector"></div>

    <div id="resultado">
      Esperando código QR...
    </div>

    <div class="nota">
      El sistema registra únicamente la entrada.
      Una segunda lectura no modifica la entrada existente.
    </div>

  </div>

  <script>

    /* DIRECCIÓN DE GOOGLE APPS SCRIPT */

    const SISTEMA = "https://script.google.com/macros/s/AKfycbx2NDqUQV9DdaPbAmDTXn0rdg9MTNMLbgz0OFMAzkS154Zwgsut3LVTthOwdcY0mjGk2g/exec";

    let procesando = false;
    let scanner = null;


    function mostrarResultado(texto) {

      document.getElementById("resultado").innerHTML = texto;

    }


    function iniciarEscaner() {

      scanner = new Html5Qrcode("lector");


      scanner.start(

        { facingMode: "environment" },

        {
          fps: 10,

          qrbox: {
            width: 280,
            height: 280
          }
        },


        function(textoQR) {

          if (procesando) return;


          let numeroLista = "";


          try {

            const url = new URL(textoQR);

            numeroLista =
              url.searchParams.get("lista") || "";

          } catch (e) {

            numeroLista = textoQR.trim();

          }


          if (!numeroLista) {

            mostrarResultado("❌ QR NO VÁLIDO");

            return;

          }


          procesando = true;


          document.getElementById("estado").innerHTML =
            "⏳ REGISTRANDO ENTRADA...";


          mostrarResultado(
            "⏳ Procesando alumno..."
          );


          const nombreFuncion =
            "respuestaQR_" + Date.now();


          window[nombreFuncion] =
            function(respuesta) {


              if (
                respuesta &&
                respuesta.resultado
              ) {

                mostrarResultado(
                  respuesta.resultado
                );

              } else {

                mostrarResultado(
                  "❌ No se recibió respuesta del sistema"
                );

              }


              document.getElementById("estado").innerHTML =
                "📷 LISTO PARA EL SIGUIENTE ALUMNO";


              delete window[nombreFuncion];


              setTimeout(function() {

                procesando = false;

                mostrarResultado(
                  "Esperando código QR..."
                );

              }, 2000);

            };


          const script =
            document.createElement("script");


          script.onerror = function() {

            delete window[nombreFuncion];

            procesando = false;


            document.getElementById("estado").innerHTML =
              "❌ ERROR DE CONEXIÓN";


            mostrarResultado(
              "No se pudo conectar con el sistema."
            );

          };


          script.src =
            SISTEMA +
            "?lista=" +
            encodeURIComponent(numeroLista) +
            "&callback=" +
            encodeURIComponent(nombreFuncion) +
            "&t=" +
            Date.now();


          document.body.appendChild(script);

        },


        function(error) {

          // Ignoramos los errores normales
          // mientras busca un código QR.

        }

      )


      .then(function() {

        document.getElementById("estado").innerHTML =
          "📷 CÁMARA ACTIVA — ESCANEA UN QR";

      })


      .catch(function(error) {

        document.getElementById("estado").innerHTML =
          "❌ NO SE PUDO ACTIVAR LA CÁMARA";


        mostrarResultado(
          "Permite el acceso a la cámara y vuelve a abrir el escáner."
        );


        console.error(error);

      });

    }


    window.addEventListener(
      "load",
      iniciarEscaner
    );

  </script>

</body>
</html>
